name: Mise à jour des sorties (DATAtourisme)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths: ["scripts/construire.py", "scripts/qualite_donnees.py", ".github/workflows/donnees.yml"]
permissions:
  contents: write
concurrency: { group: donnees, cancel-in-progress: false }
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/construire.py
        env:
          TOUT_ENRICHIR: ${{ github.event_name != 'schedule' && '1' || '0' }}
      - name: Contrôle qualité avant enregistrement (rien n'est publié si une source a renvoyé des données incohérentes)
        run: python scripts/verifier.py --donnees
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Sorties : mise à jour du $(date +%F)" || echo "rien de neuf"
          git pull --rebase -q && git push
