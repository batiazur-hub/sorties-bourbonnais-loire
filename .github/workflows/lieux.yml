name: Lieux à visiter (DATAtourisme)
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 0"
  push:
    paths: ["scripts/lieux.py", ".github/workflows/lieux.yml"]
permissions:
  contents: write
concurrency: { group: donnees, cancel-in-progress: false }
jobs:
  lieux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/lieux.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Lieux à visiter : mise à jour du $(date +%F)" || echo "rien de neuf"
          git pull --rebase -q && git push
