name: Sonde sources Paris
on:
  push:
    paths: ["scripts/sonde_paris.py", ".github/workflows/sonde-paris.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sonde_paris.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/_sonde_paris.json && git commit -m "Sonde des sources parisiennes" && git pull --rebase -q && git push
