name: Sonde sources (3)
on:
  push:
    paths: ["scripts/sonde3.py", ".github/workflows/sonde3.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sonde3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/_sonde3.json && git commit -m "Sonde des sources (2)" && git pull --rebase -q && git push
