name = "trucs-a-faire"
main = "worker.js"
compatibility_date = "2026-09-01"

# Adresse publique du serveur (domaine personnalisé, certificat géré par Cloudflare)
routes = [ { pattern = "api.trucsafaire.fr", custom_domain = true } ]

workers_dev = true

# Espace de stockage « TRUCS_A_FAIRE_DLC » (compte Cloudflare, données dans l'UE)
[[kv_namespaces]]
binding = "DLC"
id = "543d9c2b55694a6c8334a897f987bd09"

[observability]
enabled = true

# Suppression des comptes inactifs depuis 3 ans : chaque lundi à 3 h 17 UTC
# « Le Truc de la semaine » : jeudi de 5 h à 9 h UTC, toutes les 15 minutes, par lots
[triggers]
crons = ["17 3 * * 1", "*/15 5-9 * * 4"]

[vars]
ORIGINS = "https://trucsafaire.fr,https://www.trucsafaire.fr,https://batiazur-hub.github.io"
SITE_URL = "https://batiazur-hub.github.io/sorties-bourbonnais-loire/"
MAIL_FROM = "bonjour@trucsafaire.fr"
# Adresse publique de ce serveur (liens de désinscription dans les e-mails envoyés par la tâche planifiée)
API_URL = "https://api.trucsafaire.fr"
# Nombre d'e-mails par exécution (offre gratuite Cloudflare : 50 requêtes sortantes au plus par exécution)
NL_LOT = "30"
# Secret à créer une fois : npx wrangler secret put ADMIN_TOKEN
# Comptes : npx wrangler secret put BREVO_KEY      (clé API Brevo, envoi des liens de connexion)
#          npx wrangler secret put SIGNATURE_KEY  (texte aléatoire long, signe les liens de désinscription)
